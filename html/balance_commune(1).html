<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse financière des communes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
  <style>
    body {
      font-family: Inter, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #faf7f2;
      color: #2b2b2b;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 14px;
      color: #555;
      margin-top: 0;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    p.credit {
      font-size: 12px;
      color: #888;
      margin-top: 32px;
    }
    p.credit a {
      color: #2b6cb0;
    }
  </style>
</head>
<body>
  <h1>Analyse financière des communes (1)</h1>
  <p class="subtitle">Visualisation des indicateurs financiers issus des balances comptables des communes des départements 04, 25, 26, 29, 31 et 70, sur la période 2011 à 2024.</p>
  <div class="controls">
    <div id="observablehq-viewof-selected_dept-fd416df3"></div>
    <div id="observablehq-viewof-selected_commune-fd416df3"></div>
  </div>
  <div id="observablehq-chart-fd416df3"></div>
  <div class="buttons">
    <div id="observablehq-indicateurs_commune_intercommunalite_hab_dl_button-fd416df3"></div>
    <div id="observablehq-indicateurs_commune_intercommunalite_hab_dl_button1-fd416df3"></div>
  </div>
  <p class="credit">Credit : <a href="https://observablehq.com/d/4077f6f618f0fa79@1148">Analyse financière des communes (partie 2) by Alain Ottenheimer</a></p>
  <script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import define from "https://api.observablehq.com/d/4077f6f618f0fa79@1148.js?v=4";
    new Runtime().module(define, name => {
      if (name === "viewof selected_dept") return new Inspector(document.querySelector("#observablehq-viewof-selected_dept-fd416df3"));
      if (name === "viewof selected_commune") return new Inspector(document.querySelector("#observablehq-viewof-selected_commune-fd416df3"));
      if (name === "chart") return new Inspector(document.querySelector("#observablehq-chart-fd416df3"));
      if (name === "indicateurs_commune_intercommunalite_hab_dl_button") return new Inspector(document.querySelector("#observablehq-indicateurs_commune_intercommunalite_hab_dl_button-fd416df3"));
      if (name === "indicateurs_commune_intercommunalite_hab_dl_button1") return new Inspector(document.querySelector("#observablehq-indicateurs_commune_intercommunalite_hab_dl_button1-fd416df3"));
      return ["liste_communes","selected_url_dept","extraction_data_commune","selected_commune_siren","data_selected_commune","data_selected_commune_enriched","population","viewof selection","indicateurs_commune","population_extended","indicateurs_commune_intercommunalite_hab","viewof selection_indicateurs"].includes(name);
    });
  </script>
</body>
</html>
