<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse financière des communes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
  <style>
    body {
      font-family: Inter, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #faf7f2;
      color: #2b2b2b;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 14px;
      color: #555;
      margin-top: 0;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .definition {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #f0ece4;
      border-left: 3px solid #aaa;
      border-radius: 4px;
      font-size: 13px;
      color: #444;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    p.credit {
      font-size: 12px;
      color: #888;
      margin-top: 32px;
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }
    p.credit a {
      color: #2b6cb0;
      text-decoration: none;
    }
    p.credit a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Analyse financière des communes (1)</h1>
  <p class="subtitle">Visualisation des indicateurs financiers issus des balances comptables des communes des départements 04, 07, 25, 26, 29, 31, 56 et 70, sur la période 2011 à 2024.</p>

  <div class="controls">
    <div id="observablehq-viewof-selected_dept-95c54712"></div>
    <div id="observablehq-viewof-selected_commune-95c54712"></div>
  </div>

  <div class="definition">
    <div id="observablehq-compte_def-95c54712"></div>
    <div id="observablehq-indicateur_def-95c54712"></div>
  </div>

  <div id="observablehq-chart-95c54712"></div>

  <div class="buttons">
    <div id="observablehq-indicateurs_commune_intercommunalite_hab_dl_button-95c54712"></div>
    <div id="observablehq-indicateurs_commune_intercommunalite_hab_dl_button1-95c54712"></div>
  </div>

  <p class="credit">Source : <a href="https://observablehq.com/d/4077f6f618f0fa79@1153">Analyse financière des communes (partie 1) by Alain Ottenheimer</a></p>

  <script type="module">
 import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
import define from "https://api.observablehq.com/d/4077f6f618f0fa79@1163.js?v=4";


    new Runtime().module(define, name => {
      if (name === "viewof selected_dept") return new Inspector(document.querySelector("#observablehq-viewof-selected_dept-95c54712"));
      if (name === "viewof selected_commune") return new Inspector(document.querySelector("#observablehq-viewof-selected_commune-95c54712"));
      if (name === "chart") return new Inspector(document.querySelector("#observablehq-chart-95c54712"));
      if (name === "indicateurs_commune_intercommunalite_hab_dl_button") return new Inspector(document.querySelector("#observablehq-indicateurs_commune_intercommunalite_hab_dl_button-95c54712"));
      if (name === "indicateurs_commune_intercommunalite_hab_dl_button1") return new Inspector(document.querySelector("#observablehq-indicateurs_commune_intercommunalite_hab_dl_button1-95c54712"));
      if (name === "compte_def") return new Inspector(document.querySelector("#observablehq-compte_def-95c54712"));
      if (name === "indicateur_def") return new Inspector(document.querySelector("#observablehq-indicateur_def-95c54712"));
      return ["liste_communes","selected_url_dept","extraction_data_commune","selected_commune_siren","data_selected_commune","data_selected_commune_enriched","population","viewof selection","indicateurs_commune","population_extended","indicateurs_commune_intercommunalite_hab","viewof selection_indicateurs"].includes(name);
    });
  </script>
</body>
</html>
